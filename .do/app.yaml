spec:
  name: codenova
  region: nyc
  services:
    - name: backend
      git:
        repo_clone_url: https://github.com/RevanRaoK/CodeNova.git
        branch: master
      source_dir: backend
      environment_slug: python
      run_command: uvicorn app.main:app --host 0.0.0.0 --port 8000
      build_command: pip install -r requirements.txt
      http_port: 8000
      instance_size_slug: basic-xxs
      instance_count: 1
      envs:
        - key: ENVIRONMENT
          scope: RUN_TIME
          type: GENERAL
          value: production
        - key: SECRET_KEY
          scope: RUN_TIME
          type: SECRET
        - key: DATABASE_URL
          scope: RUN_TIME
          type: SECRET
        - key: REDIS_URL
          scope: RUN_TIME
          type: SECRET
        - key: RABBITMQ_URL
          scope: RUN_TIME
          type: SECRET
        - key: GEMINI_API_KEY
          scope: RUN_TIME
          type: SECRET
        - key: GEMINI_MODEL
          scope: RUN_TIME
          type: GENERAL
          value: models/gemini-2.5-flash
        - key: GOOGLE_CLIENT_ID
          scope: RUN_TIME
          type: GENERAL
        - key: GOOGLE_CLIENT_SECRET
          scope: RUN_TIME
          type: SECRET
        - key: GOOGLE_REDIRECT_URI
          scope: RUN_TIME
          type: GENERAL
          value: https://your-domain/api/v1/auth/google/callback
        - key: ALLOWED_ORIGINS
          scope: RUN_TIME
          type: GENERAL
          value: https://your-domain
        - key: TRUSTED_HOSTS
          scope: RUN_TIME
          type: GENERAL
          value: your-domain
  static_sites:
    - name: frontend
      git:
        repo_clone_url: https://github.com/RevanRaoK/CodeNova.git
        branch: master
      source_dir: frontend
      build_command: npm install && npm run build
      output_dir: dist
      envs:
        - key: VITE_API_BASE_URL
          scope: RUN_AND_BUILD_TIME
          type: GENERAL
          value: https://your-domain/api/v1
        - key: VITE_GOOGLE_CLIENT_ID
          scope: RUN_AND_BUILD_TIME
          type: GENERAL
        - key: VITE_APP_ENV
          scope: RUN_AND_BUILD_TIME
          type: GENERAL
          value: production
      routes:
        - path: /
