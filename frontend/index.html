<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary Meta Tags -->
    <title>CodeReviewAI - Intelligent Code Review</title>
    <meta name="title" content="CodeReviewAI - Intelligent Code Review" />
    <meta
      name="description"
      content="AI-powered code review and analysis tool for developers. Get instant feedback on your code quality, security, and performance."
    />
    <meta
      name="keywords"
      content="code review, AI, static analysis, code quality, developer tools"
    />
    <meta name="author" content="CodeReviewAI Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codereviewai.com/" />
    <meta
      property="og:title"
      content="CodeReviewAI - Intelligent Code Review"
    />
    <meta
      property="og:description"
      content="AI-powered code review and analysis tool for developers. Get instant feedback on your code quality, security, and performance."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://codereviewai.com/" />
    <meta
      property="twitter:title"
      content="CodeReviewAI - Intelligent Code Review"
    />
    <meta
      property="twitter:description"
      content="AI-powered code review and analysis tool for developers. Get instant feedback on your code quality, security, and performance."
    />
    <meta property="twitter:image" content="/twitter-image.png" />

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="CodeReviewAI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CodeReviewAI" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#4f46e5" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png" />
    <link rel="apple-touch-icon" href="/icon-180x180.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#4f46e5" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />

    <!-- Performance Hints -->
    <link rel="preload" href="/src/main.tsx" as="script" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#4F46E5',
              secondary: '#6366F1',
              accent: '#A78BFA',
            },
          },
        },
      };
    </script>
  </body>
</html>
