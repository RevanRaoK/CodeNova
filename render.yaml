databases:
  - name: codenova-postgres
    plan: free
    databaseName: codenova_db
    user: postgres

services:
  - name: codenova-redis
    type: redis
    plan: free
    ipAllowList: []

  - name: codenova-backend
    type: web
    plan: free
    runtime: python
    rootDir: ./backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    env:
      - key: DATABASE_URL
        fromDatabase:
          name: codenova-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codenova-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://your-backend-url/api/v1/auth/google/callback" # Replace after first deploy

  - name: codenova-frontend
    type: web
    plan: free
    runtime: static
    rootDir: ./frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    env:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_BASE_URL
        value: "https://your-backend-url/api/v1" # Replace after first deploy

  - name: codenova-redis-worker
    type: worker
    plan: free
    runtime: python
    rootDir: ./backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.core.redis_worker"
    env:
      - key: DATABASE_URL
        fromDatabase:
          name: codenova-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codenova-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: codenova-backend
          envVarKey: SECRET_KEY
      - key: ENVIRONMENT
        value: production